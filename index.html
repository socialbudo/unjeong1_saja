<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기출 한자성어 퀴즈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f1f5f9;
        }
        .correct-bg { background-color: #10b981 !important; }
        .incorrect-bg { background-color: #ef4444 !important; }
        .correct-border { border-color: #10b981 !important; }
        .incorrect-border { border-color: #ef4444 !important; }
        .correct-text { color: #10b981 !important; }
        .incorrect-text { color: #ef4444 !important; }
        
        /* 카드 플립 애니메이션 효과 */
        .card-perspective {
            perspective: 1000px;
        }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-800">

    <!-- 모바일 최적화 컨테이너 (최대 480px) -->
    <div id="app" class="w-full max-w-[480px] bg-white rounded-3xl shadow-xl min-h-[640px] flex flex-col justify-between overflow-hidden border border-slate-100 relative">
        
        <!-- 제작자 및 타이틀 표기 (Maker Tag Header) -->
        <header class="bg-slate-900 text-white px-5 py-3.5 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-2">
                <span class="bg-blue-600 text-xs px-2 py-0.5 rounded-full font-bold uppercase tracking-wider text-white">기출</span>
                <h1 class="font-bold text-base text-slate-100">한자성어 퀴즈</h1>
            </div>
            <span class="text-xs text-slate-400 font-medium">운정고 1학년 국어</span>
        </header>

        <!-- ================= 1. 메인 설정 화면 ================= -->
        <main id="main-screen" class="flex-1 p-5 flex flex-col space-y-6 overflow-y-auto">
            
            <!-- 초성(Day) 선택 영역 -->
            <section class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-list-check text-blue-600"></i> 초성 선택 (범위)
                    </label>
                    <button id="toggle-all-btn" class="text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 px-2.5 py-1 rounded-md transition-colors">
                        전체 해제
                    </button>
                </div>
                <!-- 초성 그리드 -->
                <div id="initial-grid" class="grid grid-cols-3 gap-2">
                    <!-- JS로 초성 체크박스 동적 생성됨 -->
                </div>
            </section>

            <!-- 학습 범위 필터 -->
            <section class="space-y-2">
                <label class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-filter text-blue-600"></i> 퀴즈 대상 필터
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <button class="filter-btn active py-2.5 px-2 rounded-xl border text-xs font-bold transition-all border-blue-600 bg-blue-50 text-blue-600 flex items-center justify-center gap-1" data-filter="all">
                        <i class="fa-solid fa-border-all"></i> 전체 성어
                    </button>
                    <button class="filter-btn py-2.5 px-2 rounded-xl border text-xs font-bold transition-all border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1" data-filter="star">
                        <i class="fa-solid fa-star text-amber-400"></i> 즐겨찾기
                    </button>
                    <button class="filter-btn py-2.5 px-2 rounded-xl border text-xs font-bold transition-all border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1" data-filter="wrong">
                        <i class="fa-solid fa-circle-xmark text-rose-500"></i> 오답노트
                    </button>
                </div>
            </section>

            <!-- 정렬 방식 선택 -->
            <section class="space-y-2">
                <label class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-down-wide-short text-blue-600"></i> 문제 순서 정렬
                </label>
                <div class="grid grid-cols-2 gap-2">
                    <button class="sort-btn active py-2.5 rounded-xl border text-xs font-bold transition-all border-blue-600 bg-blue-50 text-blue-600 flex items-center justify-center gap-1.5" data-sort="shuffle">
                        <i class="fa-solid fa-shuffle"></i> 무작위 섞기
                    </button>
                    <button class="sort-btn py-2.5 rounded-xl border text-xs font-bold transition-all border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center gap-1.5" data-sort="order">
                        <i class="fa-solid fa-arrow-down-a-z"></i> 초성 순서대로
                    </button>
                </div>
            </section>

            <!-- 퀴즈 시작 버튼 2개 (모드 선택) -->
            <section class="pt-2 space-y-3 mt-auto">
                <label class="text-xs font-semibold text-slate-400 block text-center">원하는 모드를 선택하여 퀴즈를 시작하세요</label>
                <div class="grid grid-cols-2 gap-3">
                    <button id="start-swipe-btn" class="w-full py-4 bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center gap-1">
                        <span class="text-base">👆 스와이프 퀴즈</span>
                        <span class="text-[11px] font-normal text-slate-300">뜻 보고 정답 훑어보기</span>
                    </button>
                    <button id="start-test-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition-all flex flex-col items-center justify-center gap-1">
                        <span class="text-base">⌨️ 타이핑 시험</span>
                        <span class="text-[11px] font-normal text-blue-100">직접 한글 음 입력하기</span>
                    </button>
                </div>
            </section>
        </main>

        <!-- ================= 2. 퀴즈 진행 화면 ================= -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col justify-between p-5 overflow-y-auto">
            
            <!-- Quiz 상단 헤더 & 진행 바 -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <button id="quit-quiz-btn" class="text-xs font-bold text-slate-400 hover:text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-arrow-left"></i> 그만하기
                    </button>
                    <div class="flex items-center gap-2">
                        <span id="quiz-badge" class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-0.5 rounded-full">ㄱ</span>
                        <span id="quiz-progress-text" class="text-xs font-bold text-slate-600">1 / 100</span>
                    </div>
                </div>
                <!-- 프로그레스 바 -->
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div id="quiz-progress-bar" class="bg-blue-600 h-full transition-all duration-300 w-0"></div>
                </div>
            </div>

            <!-- 스마트 안내 팁 배너 (타이핑 모드전용) -->
            <div id="smart-tip" class="my-2 bg-slate-50 border border-slate-200 text-slate-500 text-[11px] px-3 py-1.5 rounded-xl text-center flex items-center justify-center gap-1.5">
                <i class="fa-regular fa-lightbulb text-amber-500"></i>
                <span><b>Enter</b> 1회 = 채점 / 2회 = 다음 문제</span>
            </div>

            <!-- 카드 영역 -->
            <div class="my-auto py-2">
                <div id="quiz-card" class="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-md relative flex flex-col justify-between min-h-[240px] transition-all">
                    <!-- 즐겨찾기 버튼 (상단 우측) -->
                    <button id="card-star-btn" class="absolute top-5 right-5 text-2xl text-slate-300 hover:text-amber-400 transition-colors z-10 focus:outline-none">
                        <i class="fa-solid fa-star"></i>
                    </button>

                    <!-- 카드 질문 (뜻 A 또는 뜻 B 랜덤 노출) -->
                    <div class="flex-1 flex flex-col justify-center items-center text-center my-4 pr-6 pl-2">
                        <span class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-md mb-3">다음 뜻을 가진 한자성어는?</span>
                        <p id="card-meaning" class="text-lg font-bold text-slate-800 leading-relaxed word-keep-all">
                            <!-- 뜻 텍스트 -->
                        </p>
                    </div>

                    <!-- 정답 표출 영역 (채점 후 or 정답 확인 시) -->
                    <div id="card-answer-box" class="hidden border-t border-slate-100 pt-4 mt-2 text-center space-y-1">
                        <div class="flex items-center justify-center gap-2">
                            <span id="answer-word" class="text-2xl font-black text-slate-900"></span>
                            <span id="answer-hanja" class="text-lg font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 조작 영역 -->
            <div class="space-y-3 pt-2">
                <!-- 1) 스와이프 모드 컨트롤 -->
                <div id="swipe-controls" class="hidden flex flex-col space-y-2">
                    <button id="swipe-reveal-btn" class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-2xl shadow transition-colors flex items-center justify-center gap-2">
                        <i class="fa-regular fa-eye"></i> 정답 확인하기
                    </button>
                </div>

                <!-- 2) 타이핑 시험 모드 컨트롤 -->
                <div id="test-controls" class="hidden space-y-2">
                    <div class="flex gap-2">
                        <input type="text" id="test-input" placeholder="한글 음 입력 (예: 고진감래)" 
                               class="flex-1 border-2 border-slate-200 rounded-2xl px-4 py-3 text-base font-bold focus:outline-none focus:border-blue-600 transition-colors text-center"
                               autocomplete="off">
                        <button id="test-submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 rounded-2xl transition-colors shrink-0">
                            확인
                        </button>
                    </div>
                </div>

                <!-- 이전 / 다음 네비게이션 -->
                <div class="flex justify-between items-center gap-3 pt-1">
                    <button id="prev-btn" class="flex-1 py-2.5 border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 text-xs transition-colors disabled:opacity-30 disabled:pointer-events-none">
                        <i class="fa-solid fa-chevron-left"></i> 이전
                    </button>
                    <button id="next-btn" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 text-xs transition-colors flex items-center justify-center gap-1">
                        다음 <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 푸터 -->
        <footer class="bg-slate-50 border-t border-slate-100 py-2.5 text-center text-[11px] text-slate-400">
            기출 한자성어 퀴즈 시스템 © 2026
        </footer>
    </div>

    <!-- ================= 3. 결과 모달 (Pop-up) ================= -->
    <div id="result-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-[360px] w-full text-center space-y-5 shadow-2xl animate-fade-in">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h3 class="text-xl font-black text-slate-800">퀴즈 완료!</h3>
                <p class="text-xs text-slate-500 mt-1">선택한 모든 문제를 완풀하셨습니다.</p>
            </div>
            <div class="bg-slate-50 rounded-2xl p-4 space-y-2 border border-slate-100">
                <div class="flex justify-between text-xs font-semibold text-slate-500">
                    <span>전체 문제 수</span>
                    <span id="result-total">0 개</span>
                </div>
                <div class="flex justify-between text-xs font-semibold text-emerald-600">
                    <span>맞힌 개수</span>
                    <span id="result-correct">0 개</span>
                </div>
                <div class="flex justify-between text-sm font-bold text-slate-800 border-t border-slate-200 pt-2">
                    <span>최종 정답률</span>
                    <span id="result-score" class="text-blue-600">0%</span>
                </div>
            </div>
            <button id="modal-close-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-colors">
                확인 및 메인으로
            </button>
        </div>
    </div>

            { id: 96, initial: "ㅎ", word: "화룡점정", hanja: "畫龍點睛", meanA: "용을 그린 다음 마지막으로 눈동자를 그린다는 뜻으로 가장 요긴한 부분을 마쳐 일을 끝냄을 이르는 말" },
            { id: 97, initial: "ㅎ", word: "환골탈태", hanja: "換骨奪胎", meanA: "뼈대를 바꾸어 끼고 태를 바꾸어 쓴다는 뜻", meanB: "사람이 보다 나은 방향으로 변하여 전혀 딴사람처럼 됨" },
            { id: 98, initial: "ㅎ", word: "회자정리", hanja: "會者定離", meanA: "만나면 언젠가는 헤어지게 되어 있다는 뜻" },
            { id: 99, initial: "ㅎ", word: "후안무치", hanja: "厚顔無恥", meanA: "뻔뻔스러워 부끄러워할 줄을 모름" },
            { id: 100, initial: "ㅎ", word: "흥진비래", hanja: "興盡悲來", meanA: "즐거운 일이 지나가면 슬픈 일이 닥쳐온다는 뜻" }
        ];

        // 2. 로컬 스토리지 데이터 관리자 (StorageManager)
        const StorageManager = {
            getStars: () => JSON.parse(localStorage.getItem('ungjung_stars') || '[]'),
            setStars: (stars) => localStorage.setItem('ungjung_stars', JSON.stringify(stars)),
            toggleStar: (id) => {
                let stars = StorageManager.getStars();
                if (stars.includes(id)) {
                    stars = stars.filter(sId => sId !== id);
                } else {
                    stars.push(id);
                }
                StorageManager.setStars(stars);
                return stars.includes(id);
            },
            getWrongs: () => JSON.parse(localStorage.getItem('ungjung_wrongs') || '[]'),
            addWrong: (id) => {
                let wrongs = StorageManager.getWrongs();
                if (!wrongs.includes(id)) {
                    wrongs.push(id);
                    localStorage.setItem('ungjung_wrongs', JSON.stringify(wrongs));
                }
            },
            removeWrong: (id) => {
                let wrongs = StorageManager.getWrongs();
                wrongs = wrongs.filter(wId => wId !== id);
                localStorage.setItem('ungjung_wrongs', JSON.stringify(wrongs));
            }
        };

        // 3. 상태 관리 변수
        let selectedInitials = [];
        let currentFilter = 'all'; // 'all', 'star', 'wrong'
        let currentSort = 'shuffle'; // 'shuffle', 'order'
        let currentMode = 'swipe'; // 'swipe', 'test'
        
        let quizList = [];
        let currentIndex = 0;
        let isGraded = false; // 타이핑 시험용 채점 여부
        let sessionCorrectCount = 0;

        // 초성 목록 및 개수 파악
        const initialCounts = {};
        vocabularyData.forEach(item => {
            initialCounts[item.initial] = (initialCounts[item.initial] || 0) + 1;
        });
        const allInitials = Object.keys(initialCounts);
        selectedInitials = [...allInitials]; // 기본값: 전체 선택

        // 4. UI 요소를 DOM에서 획득
        const mainScreen = document.getElementById('main-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const initialGrid = document.getElementById('initial-grid');
        const toggleAllBtn = document.getElementById('toggle-all-btn');
        
        const quizProgressText = document.getElementById('quiz-progress-text');
        const quizProgressBar = document.getElementById('quiz-progress-bar');
        const quizBadge = document.getElementById('quiz-badge');
        const smartTip = document.getElementById('smart-tip');
        
        const quizCard = document.getElementById('quiz-card');
        const cardStarBtn = document.getElementById('card-star-btn');
        const cardMeaning = document.getElementById('card-meaning');
        const cardAnswerBox = document.getElementById('card-answer-box');
        const answerWord = document.getElementById('answer-word');
        const answerHanja = document.getElementById('answer-hanja');
        
        const swipeControls = document.getElementById('swipe-controls');
        const swipeRevealBtn = document.getElementById('swipe-reveal-btn');
        
        const testControls = document.getElementById('test-controls');
        const testInput = document.getElementById('test-input');
        const testSubmitBtn = document.getElementById('test-submit-btn');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const quitQuizBtn = document.getElementById('quit-quiz-btn');

        const resultModal = document.getElementById('result-modal');
        const resultTotal = document.getElementById('result-total');
        const resultCorrect = document.getElementById('result-correct');
        const resultScore = document.getElementById('result-score');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // 5. 초기 화면 세팅 함수
        function initMainScreen() {
            // 초성 체크박스 그리드 생성
            initialGrid.innerHTML = '';
            allInitials.forEach(init => {
                const count = initialCounts[init];
                const isChecked = selectedInitials.includes(init);
                const label = document.createElement('label');
                label.className = `flex items-center justify-between p-2.5 rounded-xl border text-xs font-bold cursor-pointer transition-all ${
                    isChecked ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-200 bg-white text-slate-600'
                }`;
                label.innerHTML = `
                    <span>${init} (${count})</span>
                    <input type="checkbox" value="${init}" ${isChecked ? 'checked' : ''} class="hidden">
                    <i class="fa-solid ${isChecked ? 'fa-square-check text-blue-600' : 'fa-square text-slate-300'} text-base"></i>
                `;
                
                const checkbox = label.querySelector('input');
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        selectedInitials.push(init);
                    } else {
                        selectedInitials = selectedInitials.filter(i => i !== init);
                    }
                    updateInitialGridUI();
                });

                initialGrid.appendChild(label);
            });
        }

        function updateInitialGridUI() {
            const labels = initialGrid.querySelectorAll('label');
            labels.forEach(label => {
                const checkbox = label.querySelector('input');
                const isChecked = selectedInitials.includes(checkbox.value);
                checkbox.checked = isChecked;
                if (isChecked) {
                    label.className = 'flex items-center justify-between p-2.5 rounded-xl border text-xs font-bold cursor-pointer transition-all border-blue-600 bg-blue-50 text-blue-700';
                    label.querySelector('i').className = 'fa-solid fa-square-check text-blue-600 text-base';
                } else {
                    label.className = 'flex items-center justify-between p-2.5 rounded-xl border text-xs font-bold cursor-pointer transition-all border-slate-200 bg-white text-slate-600';
                    label.querySelector('i').className = 'fa-solid fa-square text-slate-300 text-base';
                }
            });
            toggleAllBtn.textContent = selectedInitials.length === allInitials.length ? '전체 해제' : '전체 선택';
        }

        // 6. 이벤트 리스너 등록
        toggleAllBtn.addEventListener('click', () => {
            if (selectedInitials.length === allInitials.length) {
                selectedInitials = [];
            } else {
                selectedInitials = [...allInitials];
            }
            updateInitialGridUI();
        });

        // 필터 버튼 클릭
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'border-blue-600', 'bg-blue-50', 'text-blue-600');
                    b.classList.add('border-slate-200', 'text-slate-600');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'border-blue-600', 'bg-blue-50', 'text-blue-600');
                target.classList.remove('border-slate-200', 'text-slate-600');
                currentFilter = target.dataset.filter;
            });
        });

        // 정렬 버튼 클릭
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.sort-btn').forEach(b => {
                    b.classList.remove('active', 'border-blue-600', 'bg-blue-50', 'text-blue-600');
                    b.classList.add('border-slate-200', 'text-slate-600');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'border-blue-600', 'bg-blue-50', 'text-blue-600');
                target.classList.remove('border-slate-200', 'text-slate-600');
                currentSort = target.dataset.sort;
            });
        });

        // 퀴즈 시작 (스와이프 / 타이핑)
        document.getElementById('start-swipe-btn').addEventListener('click', () => startQuiz('swipe'));
        document.getElementById('start-test-btn').addEventListener('click', () => startQuiz('test'));

        function startQuiz(mode) {
            currentMode = mode;
            
            // 1) 조건에 맞는 데이터 필터링
            let filtered = vocabularyData.filter(item => selectedInitials.includes(item.initial));

            if (currentFilter === 'star') {
                const stars = StorageManager.getStars();
                filtered = filtered.filter(item => stars.includes(item.id));
            } else if (currentFilter === 'wrong') {
                const wrongs = StorageManager.getWrongs();
                filtered = filtered.filter(item => wrongs.includes(item.id));
            }

            if (filtered.length === 0) {
                alert('선택한 조건에 해당하는 한자성어가 없습니다.');
                return;
            }

            // 2) 정렬
            if (currentSort === 'shuffle') {
                quizList = [...filtered].sort(() => Math.random() - 0.5);
            } else {
                quizList = [...filtered].sort((a, b) => a.id - b.id);
            }

            currentIndex = 0;
            sessionCorrectCount = 0;
            
            // 화면 전환
            mainScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            // 컨트롤 바 UI 설정
            if (currentMode === 'swipe') {
                swipeControls.classList.remove('hidden');
                testControls.classList.add('hidden');
                smartTip.classList.add('hidden');
            } else {
                swipeControls.classList.add('hidden');
                testControls.classList.remove('hidden');
                smartTip.classList.remove('hidden');
            }

            renderCard();
        }

        // 7. 카드 출력 함수
        function renderCard() {
            const currentItem = quizList[currentIndex];
            isGraded = false;

            // 카드 스타일 리셋
            quizCard.className = "bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-md relative flex flex-col justify-between min-h-[240px] transition-all";
            cardAnswerBox.classList.add('hidden');
            
            // 프로그레스 바 & 헤더
            quizBadge.textContent = currentItem.initial;
            quizProgressText.textContent = `${currentIndex + 1} / ${quizList.length}`;
            quizProgressBar.style.width = `${((currentIndex + 1) / quizList.length) * 100}%`;

            // 핵심 요구사항: 뜻 A와 뜻 B 중 무작위(Random)로 노출!
            let chosenMeaning = currentItem.meanA;
            if (currentItem.meanB && Math.random() < 0.5) {
                chosenMeaning = currentItem.meanB;
            }
            cardMeaning.textContent = `"${chosenMeaning}"`;

            // 정답 텍스트 세팅
            answerWord.textContent = currentItem.word;
            answerHanja.textContent = currentItem.hanja;

            // 즐겨찾기 버튼 상태
            updateStarBtnUI();

            // 이전/다음 버튼 상태
            prevBtn.disabled = currentIndex === 0;

            // 타이핑 모드인 경우 인풋 초기화
            if (currentMode === 'test') {
                testInput.value = '';
                testInput.disabled = false;
                testInput.focus();
                testSubmitBtn.textContent = "확인";
                testSubmitBtn.className = "bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 rounded-2xl transition-colors shrink-0";
            }
        }

        function updateStarBtnUI() {
            const currentItem = quizList[currentIndex];
            const stars = StorageManager.getStars();
            const isStarred = stars.includes(currentItem.id);
            
            if (isStarred) {
                cardStarBtn.innerHTML = `<i class="fa-solid fa-star text-amber-400"></i>`;
            } else {
                cardStarBtn.innerHTML = `<i class="fa-regular fa-star text-slate-300"></i>`;
            }
        }

        // 즐겨찾기 클릭 토글
        cardStarBtn.addEventListener('click', () => {
            const currentItem = quizList[currentIndex];
            StorageManager.toggleStar(currentItem.id);
            updateStarBtnUI();
        });

        // 8. 스와이프 모드: 정답 보기
        swipeRevealBtn.addEventListener('click', () => {
            cardAnswerBox.classList.remove('hidden');
        });
        
        // 카드 자체를 눌러도 스와이프 모드에서는 정답이 보여짐
        quizCard.addEventListener('click', (e) => {
            if (currentMode === 'swipe' && !e.target.closest('#card-star-btn')) {
                cardAnswerBox.classList.remove('hidden');
            }
        });

        // 9. 타이핑 시험 모드: 채점 로직
        function handleTestSubmit() {
            if (isGraded) {
                // 이미 채점된 상태에서 한번 더 누르거나 Enter를 치면 다음 문제로 이동
                goNext();
                return;
            }

            const currentItem = quizList[currentIndex];
            const userAns = testInput.value.trim().replace(/\s+/g, ''); // 공백 제거
            const targetAns = currentItem.word.trim().replace(/\s+/g, '');

            isGraded = true;
            cardAnswerBox.classList.remove('hidden');
            testInput.disabled = true;

            if (userAns === targetAns) {
                // 정답 (O)
                sessionCorrectCount++;
                quizCard.className = "bg-white border-2 correct-border correct-bg/5 rounded-3xl p-6 shadow-md relative flex flex-col justify-between min-h-[240px] transition-all";
                testSubmitBtn.textContent = "다음 (Enter)";
                testSubmitBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 rounded-2xl transition-colors shrink-0";
                
                // 맞히면 오답노트에서 자동 제거
                StorageManager.removeWrong(currentItem.id);
            } else {
                // 오답 (X)
                quizCard.className = "bg-white border-2 incorrect-border incorrect-bg/5 rounded-3xl p-6 shadow-md relative flex flex-col justify-between min-h-[240px] transition-all";
                testSubmitBtn.textContent = "다음 (Enter)";
                testSubmitBtn.className = "bg-rose-600 hover:bg-rose-700 text-white font-bold px-5 rounded-2xl transition-colors shrink-0";
                
                // 틀리면 오답노트에 자동 누적
                StorageManager.addWrong(currentItem.id);
            }
        }

        testSubmitBtn.addEventListener('click', handleTestSubmit);

        // 엔터 키 이벤트 (1회 엔터: 채점 / 2회 엔터: 다음 문제)
        testInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleTestSubmit();
            }
        });

        // 글로벌 엔터키 이벤트 (채점 완료 후 어디서든 엔터를 치면 다음 문제로)
        window.addEventListener('keydown', (e) => {
            if (currentMode === 'test' && isGraded && e.key === 'Enter') {
                goNext();
            }
        });

        // 10. 이동 네비게이션
        function goNext() {
            if (currentIndex < quizList.length - 1) {
                currentIndex++;
                renderCard();
            } else {
                // 모든 문제 풀이 완료 -> 결과 모달
                showResultModal();
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        nextBtn.addEventListener('click', goNext);
        prevBtn.addEventListener('click', goPrev);

        // 퀴즈 그만하기 (메인으로 복귀)
        quitQuizBtn.addEventListener('click', () => {
            if (confirm('퀴즈를 그만두고 메인 설정 화면으로 돌아가시겠습니까?')) {
                quizScreen.classList.add('hidden');
                mainScreen.classList.remove('hidden');
            }
        });

        // 11. 결과 모달 처리
        function showResultModal() {
            resultTotal.textContent = `${quizList.length} 개`;
            resultCorrect.textContent = `${sessionCorrectCount} 개`;
            const scorePercent = Math.round((sessionCorrectCount / quizList.length) * 100);
            resultScore.textContent = `${scorePercent}%`;

            resultModal.classList.remove('hidden');
        }

        modalCloseBtn.addEventListener('click', () => {
            resultModal.classList.add('hidden');
            quizScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
        });

        // 12. 초기 실행
        window.onload = function() {
            initMainScreen();
        };
    </script>
</body>
</html>
